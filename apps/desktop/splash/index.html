<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>GenCouncil</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f4ef; --fg:#2b2b2b; --mut:#8a8780; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#e8e6e1; --mut:#8d8b86; } }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  img { width:88px; height:88px; border-radius:20px; }
  .t { font-size:20px; font-weight:600; }
  .s { font-size:13px; color:var(--mut); }
  .dot { display:inline-block; animation:b 1.2s infinite; }
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
</style>
</head>
<body>
  <img src="icon.png" alt="" />
  <div class="t">GenCouncil</div>
  <div class="s" id="s">서버에 연결하는 중<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</body>
</html>
